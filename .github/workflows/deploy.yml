name: Deploy to Public Pages Repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PUBLIC_PAGES_TOKEN: ${{ secrets.PUBLIC_PAGES_TOKEN }}
      PUBLIC_PAGES_REPO: ${{ secrets.PUBLIC_PAGES_REPO }}
    steps:
      - name: Checkout private source repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and build project
        run: |
          npm run check
          npm run build:public
      - name: Save built site
        uses: actions/upload-artifact@v4
        with:
          name: mesto-public-build
          path: dist
      - name: Deploy built files to public repository
        if: ${{ env.PUBLIC_PAGES_TOKEN != '' && env.PUBLIC_PAGES_REPO != '' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PUBLIC_PAGES_TOKEN }}
          external_repository: ${{ secrets.PUBLIC_PAGES_REPO }}
          publish_dir: ./dist
          publish_branch: ${{ secrets.PUBLIC_PAGES_BRANCH || 'main' }}
          force_orphan: true
          user_name: 'OrlovViktor-idb-24-02'
          user_email: '242589486+OrlovViktor-idb-24-02@users.noreply.github.com'
          commit_message: 'deploy: update build'
      - name: Report deployment setup
        if: ${{ env.PUBLIC_PAGES_TOKEN == '' || env.PUBLIC_PAGES_REPO == '' }}
        run: echo '::notice::Build saved as artifact. Configure PUBLIC_PAGES_TOKEN and PUBLIC_PAGES_REPO to enable automatic publication.'
